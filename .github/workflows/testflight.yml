# Uploads to TestFlight from GitHub's macOS runners — no Mac of your own needed.
# Repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8 file).
# Run configure.sh once and commit the result before using this workflow.
name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/key.p8
      - name: Test, archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH=~/.appstoreconnect/key.p8 ./scripts/testflight.sh
