# Codemagic → TestFlight.
# Signing: the team's Apple Distribution identity (monetniy-mir-distribution, with private key) is
# loaded by ios_signing from Codemagic Code signing identities. App Store profiles for the app and
# the widget extension (with the App Group) are created/fetched through the App Store Connect API
# by scripts/ci_profiles.sh. No new certificates are created.
workflows:
  ios-testflight:
    name: ZIKR → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      xcode: latest
      ios_signing:
        certificates:
          - monetniy-mir-distribution
        # Codemagic requires a stored profile next to the certificate; this team profile is only
        # loaded, never used for ZIKR (its own profiles come from scripts/ci_profiles.sh).
        provisioning_profiles:
          - mayor-city-app-store
      vars:
        ZIKR_TEAM_ID: "8PMNK7YN6D"
        ZIKR_BUNDLE_ID: "com.neverlandplayworks.zikr"
        ZIKR_PRIVACY_URL: "https://sardorcos.github.io/zikr/privacy-policy.html"
        ZIKR_SUPPORT_URL: "https://sardorcos.github.io/zikr/support.html"
    scripts:
      - name: Environment check
        script: |
          xcodebuild -version
          for v in APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -n "${!v:-}" ]; then echo "$v: set"; else echo "$v: MISSING"; fi
          done
      - name: Detect team and bundle ID
        script: |
          eval "$(./scripts/ci_detect.sh build)"
          echo "ZIKR_TEAM_ID=$ZIKR_TEAM_ID" >> "$CM_ENV"
          echo "ZIKR_BUNDLE_ID=$ZIKR_BUNDLE_ID" >> "$CM_ENV"
          echo "ZIKR_UPLOAD=$ZIKR_UPLOAD" >> "$CM_ENV"
      - name: Configure project
        script: ./scripts/configure.sh "$ZIKR_TEAM_ID" "$ZIKR_BUNDLE_ID" "${ZIKR_PRIVACY_URL:-}" "${ZIKR_SUPPORT_URL:-}"
      - name: Provisioning profiles
        script: ./scripts/ci_profiles.sh build
      - name: Test, archive and export IPA
        script: |
          export ZIKR_SIGNING=manual
          mkdir -p "$HOME/.appstoreconnect"
          python3 scripts/ci_write_key.py "$HOME/.appstoreconnect/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          export ASC_KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          export ASC_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          # Key ID and issuer ID are identifiers, not secrets; logged to diagnose auth problems.
          { echo "key_id=[$ASC_KEY_ID] (${#ASC_KEY_ID} chars)"; echo "issuer=[$ASC_ISSUER_ID] (${#ASC_ISSUER_ID} chars)"; } | tee -a build/ci-key.log
          export ASC_KEY_PATH="$HOME/.appstoreconnect/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          ./scripts/testflight.sh
    artifacts:
      - build/*.log
      - build/*.json
      - build/*.err
      - build/cert-*.log
      - build/*.plist
      - build/export/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # App Store screenshots (6.9", 1320 x 2868) from the simulator with debug-only demo content
  # (launch argument -ZIKRScreenshots, see ZIKR/App/ScreenshotDemo.swift). No signing needed.
  zikr-screenshots:
    name: ZIKR — App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Build for the simulator
        script: |
          set -euo pipefail
          xcodebuild -project ZIKR.xcodeproj -scheme ZIKR -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -n 5
      - name: Capture screenshots
        script: |
          set -euo pipefail
          APP=$(ls -d build/sim/Build/Products/Debug-iphonesimulator/ZIKR.app)
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; t=[d for d in json.load(sys.stdin)['devicetypes'] if re.search(r'iPhone \d+ Pro Max', d['name'])]; t.sort(key=lambda d:int(re.search(r'\d+',d['name']).group())); print(t[-1]['identifier'])")
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          echo "device type $TYPE runtime $RT"
          mkdir -p screenshots
          for LANG in ru en; do
            UDID=$(xcrun simctl create "Shots-$LANG" "$TYPE" "$RT")
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl ui "$UDID" appearance dark
            xcrun simctl install "$UDID" "$APP"
            # First-boot system tips (e.g. "Ready for Apple Intelligence") pop up about a minute after
            # boot; let them come and go before capturing.
            xcrun simctl launch "$UDID" "$BID" -ZIKRScreenshots >/dev/null; sleep 90
            LOC=ru_RU; [ "$LANG" = en ] && LOC=en_US
            for SHOT in home items stats settings night; do
              EXTRA=(-ZIKRTab "$SHOT"); [ "$SHOT" = night ] && EXTRA=(-ZIKRTab home -ZIKRNight)
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BID" -AppleLanguages "($LANG)" -AppleLocale "$LOC" -ZIKRScreenshots "${EXTRA[@]}"
              sleep 6
              xcrun simctl io "$UDID" screenshot "screenshots/$LANG-$SHOT.png"
            done
            xcrun simctl shutdown "$UDID"; xcrun simctl delete "$UDID"
          done
          sips -g pixelWidth -g pixelHeight screenshots/*.png | grep pixel | sort | uniq -c
      - name: Apple Watch screenshots
        script: |
          set -euo pipefail
          xcodebuild -project ZIKR.xcodeproj -target ZIKRWatch -configuration Debug -sdk watchsimulator \
            SYMROOT="$PWD/build/watch" CODE_SIGNING_ALLOWED=NO build | tail -n 3
          WAPP=$(ls -d build/watch/Debug-watchsimulator/ZIKRWatch.app)
          WBID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WAPP/Info.plist")
          WTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; t=[d for d in json.load(sys.stdin)['devicetypes'] if re.search(r'Apple Watch Series \d+ \(46mm\)', d['name'])]; t.sort(key=lambda d:int(re.search(r'Series (\d+)',d['name']).group(1))); print(t[-1]['identifier'])")
          WRT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='watchOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          echo "watch type $WTYPE runtime $WRT"
          for LANG in ru en; do
            W=$(xcrun simctl create "Watch-$LANG" "$WTYPE" "$WRT")
            xcrun simctl boot "$W"; xcrun simctl bootstatus "$W" -b
            xcrun simctl install "$W" "$WAPP"
            xcrun simctl launch "$W" "$WBID" -AppleLanguages "($LANG)" -ZIKRScreenshots >/dev/null; sleep 60
            xcrun simctl terminate "$W" "$WBID" || true
            xcrun simctl launch "$W" "$WBID" -AppleLanguages "($LANG)" -ZIKRScreenshots >/dev/null; sleep 8
            xcrun simctl io "$W" screenshot "screenshots/watch-$LANG.png"
            xcrun simctl shutdown "$W"; xcrun simctl delete "$W"
          done
          sips -g pixelWidth -g pixelHeight screenshots/watch-*.png | grep pixel
    artifacts:
      - screenshots/*.png

  # App Store Connect metadata (texts, categories, price, availability, age rating, screenshots
  # incl. Apple Watch, review notes) from appstore/metadata.json, and attaching the latest build.
  app-store-metadata:
    name: ZIKR — App Store metadata
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: Apply metadata
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json

  # Same as above, then sends the version to App Review. Needs the secure group "review_contact"
  # (REVIEW_FIRST_NAME, REVIEW_LAST_NAME, REVIEW_PHONE, REVIEW_EMAIL).
  app-store-submit:
    name: ZIKR — submit for App Review
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - review_contact
    scripts:
      - name: Apply metadata and submit
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json --submit
