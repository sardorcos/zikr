# Codemagic → TestFlight.
# Signing is done by Xcode's automatic (cloud-managed) signing with the App Store Connect API key
# from the Codemagic integration below; it also registers the App Group for the app and widgets.
# Team ID and bundle ID are detected from App Store Connect unless set in `vars`.
workflows:
  ios-testflight:
    name: ZIKR → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      xcode: latest
      vars:
        ZIKR_TEAM_ID: "SET_TEAM_ID"
        ZIKR_BUNDLE_ID: "SET_BUNDLE_ID"
        ZIKR_PRIVACY_URL: ""
        ZIKR_SUPPORT_URL: ""
    scripts:
      - name: Environment check
        script: |
          xcodebuild -version
          for v in APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -n "${!v:-}" ]; then echo "$v: set"; else echo "$v: MISSING"; fi
          done
      - name: Detect team and bundle ID
        script: |
          eval "$(./scripts/ci_detect.sh build)"
          echo "ZIKR_TEAM_ID=$ZIKR_TEAM_ID" >> "$CM_ENV"
          echo "ZIKR_BUNDLE_ID=$ZIKR_BUNDLE_ID" >> "$CM_ENV"
          echo "ZIKR_UPLOAD=$ZIKR_UPLOAD" >> "$CM_ENV"
      - name: Configure project
        script: ./scripts/configure.sh "$ZIKR_TEAM_ID" "$ZIKR_BUNDLE_ID" "$ZIKR_PRIVACY_URL" "$ZIKR_SUPPORT_URL"
      - name: Test, archive and upload to TestFlight
        script: |
          mkdir -p "$HOME/.appstoreconnect"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/AuthKey.p8"
          export ASC_KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          export ASC_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          export ASC_KEY_PATH="$HOME/.appstoreconnect/AuthKey.p8"
          ./scripts/testflight.sh
    artifacts:
      - build/*.log
      - build/*.json
      - build/*.err
      - build/export/*.ipa
